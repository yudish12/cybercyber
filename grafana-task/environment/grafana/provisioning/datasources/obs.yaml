apiVersion: 1
datasources:
  - name: Graphite (obs)
    type: graphite
    uid: graphite-obs
    orgId: 1
    access: proxy
    url: http://metrics.obs.internal:9090
    isDefault: false
    editable: true
    jsonData:
      graphiteVersion: "1.1"

  - name: TestData DB
    type: grafana-testdata-datasource
    uid: testdata
    orgId: 1
    access: proxy
    isDefault: true
    editable: false

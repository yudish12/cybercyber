name: grafana-proxy-guard-drop
services:
  grafana:
    build:
      context: ./grafana
      dockerfile: Dockerfile
      args:
        DSPROXY_EXACT_HOST_MATCH: ${DSPROXY_EXACT_HOST_MATCH:-0}
    environment:
      GF_SECURITY_ADMIN_USER: siteadmin
      PLATFORM_ADMIN_USER: platform-admin
      PLATFORM_ADMIN_PASS: ${PLATFORM_ADMIN_PASS:-PlatEng-OnCall-7731}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_INSTALL_PLUGINS: ""
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_DISABLE_ANGULAR: "true"
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
      GF_SECURITY_DATA_SOURCE_PROXY_WHITELIST: "metrics.obs.internal:9090,logs.obs.internal:3100"
    volumes:
      - grafana-data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health >/dev/null && test -f /var/lib/grafana/.seed_complete"]
      interval: 10s
      timeout: 5s
      retries: 40
      start_period: 30s
    networks:
      - backend
    deploy:
      resources:
        limits:
          memory: 1024M

  internal_service:
    build:
      context: ./internal_service
      dockerfile: Dockerfile
    volumes:
      - canary:/canary
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    depends_on:
      web:
        condition: service_started
    networks:
      backend:
        aliases:
          - metrics.obs.internal
          - logs.obs.internal
          - svc-c2.obs.internal
          - svc-a3.obs.internal
          - svc-e4.obs.internal
          - svc-b7.obs.internal
          - svc-d9.obs.internal
    deploy:
      resources:
        limits:
          memory: 256M

  web:
    build:
      context: ./gateway
    environment:
      BACKEND_UPSTREAM: http://grafana:3000   # app-wiring: grafana's internal service URL
    ports:
      - '8080'
    volumes:
      - vchan:/vchan
      - canary:/canary
    depends_on:
      grafana:
        condition: service_healthy
    networks:
      - default
      - backend
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M

  main:
    platform: linux/amd64
    build:
      context: ./agent
    volumes:
      - vchan:/vchan:ro
    depends_on:
      web:
        condition: service_healthy
    command:
      - sh
      - -c
      - 'i=0; while [ $$i -lt 120 ]; do curl -s -o /dev/null --max-time 3 http://web:8080/ && break; sleep 2; i=$$((i+1)); done; exec sleep infinity'

volumes:
  vchan: null
  canary: null
  grafana-data: null

networks:
  backend:
    driver: bridge
    internal: true
